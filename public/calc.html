<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감정평가 계산기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222535;
    --border: #2e3248;
    --accent: #4f7cff;
    --accent2: #7c5cfc;
    --gold: #f5c842;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --text: #e8eaf0;
    --text2: #8b90a7;
    --text3: #555a73;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0f1117 0%, #1a1d27 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-badge {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  header span {
    font-size: 12px;
    color: var(--text2);
    margin-left: 4px;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 0;
    padding: 24px 32px 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .tab-btn {
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text2);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: -0.3px;
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-btn:hover:not(.active) { color: var(--text); }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    min-height: calc(100vh - 120px);
  }

  .left-panel {
    padding: 24px 32px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }

  .right-panel {
    padding: 24px;
    background: var(--surface);
    position: sticky;
    top: 61px;
    height: calc(100vh - 61px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .add-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  /* ITEM CARDS */
  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 12px;
    position: relative;
    transition: border-color 0.2s;
  }
  .item-card:hover { border-color: var(--accent); }

  .item-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .item-num {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .item-badge {
    width: 24px; height: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  .item-label-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    width: 160px;
  }
  .item-label-input:focus { outline: none; border-color: var(--accent); }

  .delete-btn {
    width: 28px; height: 28px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text3);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .delete-btn:hover { border-color: var(--red); color: var(--red); }

  /* FORM GRID */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-grid.full { grid-template-columns: 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .field input, .field select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.2s;
    width: 100%;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field select option { background: var(--surface2); }

  .field input[readonly] {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  /* ITEM RESULT */
  .item-result {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .item-result-label {
    font-size: 11px;
    color: var(--text2);
  }

  .item-result-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }

  /* RIGHT PANEL - SUMMARY */
  .summary-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .summary-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 12px;
  }

  .summary-row-name {
    color: var(--text2);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary-row-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
  }

  .total-box {
    background: linear-gradient(135deg, rgba(79,124,255,0.15), rgba(124,92,252,0.15));
    border: 1px solid rgba(79,124,255,0.4);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }

  .total-label {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .total-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: -1px;
  }

  .total-unit {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
  }

  .reset-btn {
    padding: 10px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  .copy-btn {
    padding: 10px;
    background: linear-gradient(135deg, var(--green), #2ba872);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .copy-btn:hover { opacity: 0.85; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
    font-size: 13px;
  }

  /* REGION HELPER */
  .region-hint {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
  }

  .region-display {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    min-height: 38px;
  }

  .region-group-badge {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--gold);
  }

  .region-name-text {
    color: var(--text2);
    font-size: 12px;
  }

  /* NOTICE */
  .notice {
    padding: 10px 14px;
    background: rgba(245,200,66,0.08);
    border: 1px solid rgba(245,200,66,0.2);
    border-radius: 8px;
    font-size: 11px;
    color: var(--text2);
    line-height: 1.6;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
    .right-panel { position: static; height: auto; }
    .left-panel { padding: 16px; }
    .tabs { padding: 16px 16px 0; }
  }

  /* 영업사원/의뢰인 */
  .case-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 32px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .case-bar label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .case-bar input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 5px 10px;
    width: 180px;
  }
  .case-bar input:focus { outline: none; border-color: var(--accent); }

  /* 드래그 핸들 */
  .drag-handle {
    position: absolute;
    top: 12px; left: 12px;
    color: var(--text3);
    cursor: grab;
    font-size: 18px;
    padding: 4px;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .item-card.drag-over { border-color: var(--accent); background: #1a2035; }
  .item-card { position: relative; }

  /* 단위변환 버튼 */
  .unit-row { display: flex; gap: 6px; align-items: center; }
  .unit-toggle {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); border-radius: 6px;
    padding: 4px 8px; font-size: 11px; font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: all 0.2s;
  }
  .unit-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* 세트 저장 버튼 */
  .save-set-btn { background: rgba(245,200,66,0.1); color: var(--gold); }
  .save-set-btn:hover { background: rgba(245,200,66,0.2); }
  .load-set-btn { background: rgba(79,124,255,0.1); color: var(--accent); }
  .load-set-btn:hover { background: rgba(79,124,255,0.2); }

  /* 세트 목록 */
  .set-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: border-color 0.2s;
  }
  .set-item:hover { border-color: var(--accent); }
  .set-item-name { font-size: 13px; }
  .set-item-meta { font-size: 11px; color: var(--text3); }
  .set-del-btn {
    background: none; border: none; color: var(--text3);
    cursor: pointer; font-size: 14px; padding: 2px 6px;
  }
  .set-del-btn:hover { color: var(--red); }

</style>
</head>
<body>

<header>
  <div class="logo-badge">🏢</div>
  <div>
    <h1>감정평가 계산기 <span>공동담보 다건 계산</span></h1>
  </div>
</header>


<div class="case-bar">
  <label>영업사원</label>
  <input type="text" id="case-number" placeholder="예: 박현진" oninput="saveCaseInfo()">
  <label>거래처(농장)</label>
  <input type="text" id="client-name" placeholder="예: 선경농장" oninput="saveCaseInfo()">
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('land')">🌍 토지 감정평가</button>
  <button class="tab-btn" onclick="switchTab('building')">🏗️ 건물 감정평가</button>
</div>

<div class="main">
  <div class="left-panel">

    <!-- LAND TAB -->
    <div id="tab-land">
      <div class="section-header">
        <span class="section-title">토지 목록</span>
        <button class="add-btn" onclick="addLandItem()">＋ 토지 추가</button>
      </div>
      <div id="land-list"></div>
    </div>

    <!-- BUILDING TAB -->
    <div id="tab-building" style="display:none">
      <div class="section-header">
        <span class="section-title">건물 목록</span>
        <button class="add-btn" onclick="addBuildingItem()">＋ 건물 추가</button>
      </div>
      <div id="building-list"></div>
    </div>

  </div>

  <div class="right-panel">
    <div class="summary-title">📋 공동담보 합산</div>

    <div class="total-box">
      <div class="total-label">토지 + 건물 합산 감정가</div>
      <div class="total-value" id="grand-total">0</div>
      <div class="total-unit">원</div>
    </div>

    <div>
      <div class="summary-title" style="margin-bottom:8px">토지 소계</div>
      <div class="summary-list" id="land-summary">
        <div class="empty-state">토지를 추가해주세요</div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px">
        <span style="font-size:12px;color:var(--text2)">소계: </span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green);margin-left:6px" id="land-subtotal">0원</span>
      </div>
    </div>

    <hr class="divider">

    <div>
      <div class="summary-title" style="margin-bottom:8px">건물 소계</div>
      <div class="summary-list" id="building-summary">
        <div class="empty-state">건물을 추가해주세요</div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px">
        <span style="font-size:12px;color:var(--text2)">소계: </span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green);margin-left:6px" id="building-subtotal">0원</span>
      </div>
    </div>

    <hr class="divider">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="reset-btn" onclick="resetAll()">🗑 전체 초기화</button>
      <button class="copy-btn" onclick="copyResult()">📋 결과 복사</button>
    </div>

    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <button class="save-set-btn reset-btn" onclick="saveSet()">💾 세트 저장</button>
      <button class="load-set-btn reset-btn" onclick="toggleSetList()">📂 불러오기</button>
    </div>
    <div id="set-list-panel" style="display:none;margin-top:12px">
      <div class="summary-title" style="margin-bottom:8px">저장된 세트</div>
      <div id="set-list" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>

    <div class="notice">
      💡 공시지가는 국토교통부 부동산공시가격알리미에서 확인하세요.<br>
      신축건물 기준가액: 축사 40만 / 공장·창고 60만 / 일반건물 80만 (㎡당)
    </div>
  </div>
</div>

<script>

// ─── 영업사원/의뢰인 ───────────────────────────────────────
function saveCaseInfo() {
  localStorage.setItem('appraisal_case', document.getElementById('case-number').value);
  localStorage.setItem('appraisal_client', document.getElementById('client-name').value);
}

// ─── 묶음 세트 ─────────────────────────────────────────────
function saveSet() {
  const caseNum = document.getElementById('case-number').value.trim();
  const clientNm = document.getElementById('client-name').value.trim();
  const name = prompt('세트 이름:', caseNum || '공동담보 세트');
  if (!name) return;
  const sets = JSON.parse(localStorage.getItem('appraisal_sets') || '[]');
  const landTotal = landItems.reduce((s,i)=>s+i.result,0);
  const buildingTotal = buildingItems.reduce((s,i)=>s+i.result,0);
  sets.push({
    id: Date.now(), name, caseNum, clientNm,
    landItems: JSON.parse(JSON.stringify(landItems)),
    buildingItems: JSON.parse(JSON.stringify(buildingItems)),
    total: landTotal + buildingTotal,
    savedAt: new Date().toLocaleDateString('ko-KR')
  });
  localStorage.setItem('appraisal_sets', JSON.stringify(sets));
  alert('저장됐어요! 📁');
  renderSetList('');
}

function loadSet(id) {
  const sets = JSON.parse(localStorage.getItem('appraisal_sets') || '[]');
  const set = sets.find(s => s.id === id);
  if (!set) return;
  if (!confirm('"' + set.name + '" 세트를 불러올까요?')) return;
  landItems = set.landItems || [];
  buildingItems = set.buildingItems || [];
  document.getElementById('case-number').value = set.caseNum || '';
  document.getElementById('client-name').value = set.clientNm || '';
  saveCaseInfo(); saveData();
  renderLandList(); renderBuildingList(); updateSummary();
}

function deleteSet(id) {
  let sets = JSON.parse(localStorage.getItem('appraisal_sets') || '[]');
  sets = sets.filter(s => s.id !== id);
  localStorage.setItem('appraisal_sets', JSON.stringify(sets));
  renderSetList('');
}

function toggleSetList() {
  const panel = document.getElementById('set-list-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block') renderSetList('');
}

function renderSetList(filterSales) {
  const sets = JSON.parse(localStorage.getItem('appraisal_sets') || '[]');
  const container = document.getElementById('set-list');
  
  // 영업사원 목록 추출
  const salesPeople = [...new Set(sets.map(s=>s.caseNum).filter(Boolean))];
  
  // 필터 UI
  let filterHtml = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
  filterHtml += '<button onclick="renderSetList('')" style="' + 
    'background:' + (!filterSales ? 'var(--accent)' : 'var(--surface2)') + ';' +
    'color:' + (!filterSales ? 'white' : 'var(--text2)') + ';' +
    'border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">전체</button>';
  salesPeople.forEach(sp => {
    const active = filterSales === sp;
    filterHtml += '<button onclick="renderSetList('' + sp + '')" style="' +
      'background:' + (active ? 'var(--accent)' : 'var(--surface2)') + ';' +
      'color:' + (active ? 'white' : 'var(--text2)') + ';' +
      'border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">' + sp + '</button>';
  });
  filterHtml += '</div>';
  
  const filtered = filterSales ? sets.filter(s=>s.caseNum===filterSales) : sets;
  
  if (!sets.length) { 
    container.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px">저장된 세트가 없습니다</div>'; 
    return; 
  }
  
  const listHtml = filtered.length === 0 
    ? '<div style="font-size:12px;color:var(--text3);padding:8px">해당 영업사원의 세트가 없습니다</div>'
    : filtered.map(s =>
        '<div class="set-item" onclick="loadSet(' + s.id + ')">' +
        '<div><div class="set-item-name">' + (s.name||'') + '</div>' +
        '<div class="set-item-meta">👤 ' + (s.caseNum||'') + ' · 🏡 ' + (s.clientNm||'') + ' · ' + fmt(s.total) + '원 · ' + s.savedAt + '</div></div>' +
        '<button class="set-del-btn" onclick="event.stopPropagation();deleteSet(' + s.id + ')">✕</button></div>'
      ).join('');
  
  container.innerHTML = filterHtml + listHtml;
}

// ─── 드래그 앤 드롭 ────────────────────────────────────────
let dragSrcIdx = null, dragSrcType = null;

function dragStart(e, type, idx) { dragSrcType = type; dragSrcIdx = idx; e.dataTransfer.effectAllowed = 'move'; }
function dragOver(e, type, idx) {
  e.preventDefault();
  document.querySelectorAll('.item-card').forEach(c => c.classList.remove('drag-over'));
  if (dragSrcType === type && idx !== dragSrcIdx) {
    const items = type === 'land' ? landItems : buildingItems;
    document.getElementById((type==='land'?'land-card-':'building-card-') + items[idx].id)?.classList.add('drag-over');
  }
}
function dragDrop(e, type, idx) {
  e.preventDefault();
  if (dragSrcType !== type || dragSrcIdx === idx) return;
  const items = type === 'land' ? landItems : buildingItems;
  const [moved] = items.splice(dragSrcIdx, 1);
  items.splice(idx, 0, moved);
  saveData();
  if (type === 'land') renderLandList(); else renderBuildingList();
}
function dragEnd() { document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('drag-over')); }

// ─── 단위변환 ──────────────────────────────────────────────
function toggleAreaUnit(type, idx) {
  const items = type === 'land' ? landItems : buildingItems;
  const item = items[idx];
  if (!item.area) return;
  const val = parseFloat(item.area);
  if (!item.areaUnit || item.areaUnit === 'm2') {
    item.area = (val / 3.30579).toFixed(2);
    item.areaUnit = 'pyeong';
  } else {
    item.area = (val * 3.30579).toFixed(2);
    item.areaUnit = 'm2';
  }
  if (type === 'land') { calcLand(idx); renderLandList(); } else { calcBuilding(idx); renderBuildingList(); }
}

// ─── 공시지가 콤마 ─────────────────────────────────────────
function formatPriceInput(el, type, idx) {
  const raw = el.value.replace(/,/g, '');
  const num = parseFloat(raw);
  const items = type === 'land' ? landItems : buildingItems;
  if (!isNaN(num)) {
    items[idx].officialPrice = raw;
    el.value = num.toLocaleString('ko-KR');
    if (type === 'land') calcLand(idx); else calcBuilding(idx);
  }
}

function getRegionGroup(keyword) {
  if (!keyword || keyword.trim().length < 2) return null;
  const k = keyword.trim();
  // 1군: 광역시/특별시는 정확히 시 이름이 포함될 때만
  for (let g = 1; g <= 4; g++) {
    if (REGION_MAP[g].some(r => {
      // 입력이 DB 항목을 포함하거나, DB 항목이 입력을 포함 (단 2글자 이상 매칭)
      const matched = r.includes(k) || k.includes(r);
      if (!matched) return false;
      // 단순 조사(시,군,구,읍,동,면) 제거 후 2글자 이상인지 확인
      const base = k.replace(/[시군구읍동면]$/, '');
      return base.length >= 2;
    })) return g;
  }
  return 5;
}

let landItems = [];
let buildingItems = [];
let currentTab = 'land';
let idCounter = 0;

// ─── STORAGE ───────────────────────────────────────────────
function saveData() {
  try {
    localStorage.setItem('appraisal_land', JSON.stringify(landItems));
    localStorage.setItem('appraisal_building', JSON.stringify(buildingItems));
    localStorage.setItem('appraisal_counter', String(idCounter));
  } catch(e) {}
}

function loadData() {
  try {
    const land = localStorage.getItem('appraisal_land');
    const building = localStorage.getItem('appraisal_building');
    const counter = localStorage.getItem('appraisal_counter');
    if (land) landItems = JSON.parse(land);
    if (building) buildingItems = JSON.parse(building);
    if (counter) idCounter = parseInt(counter);
    const caseNum = localStorage.getItem('appraisal_case');
    const clientNm = localStorage.getItem('appraisal_client');
    if (caseNum) { const el = document.getElementById('case-number'); if(el) el.value = caseNum; }
    if (clientNm) { const el = document.getElementById('client-name'); if(el) el.value = clientNm; }
  } catch(e) {}
}

  currentTab = tab;
  document.getElementById('tab-land').style.display = tab === 'land' ? 'block' : 'none';

  document.querySelectorAll('.tab-btn').forEach((b, i) => {

function landRegionInput(idx, val) {
  landItems[idx].region = val;
  const g = getRegionGroup(val);
  landItems[idx].group = g;
  calcLand(idx);
  // 지역군 표시만 부분 업데이트 (전체 재렌더링 X → 키보드 내려가는 문제 방지)
  const item = landItems[idx];
  const card = document.getElementById(`land-card-${item.id}`);
  if (card) {
    const regionDisplay = card.querySelector('.region-display');
    if (regionDisplay) {
      regionDisplay.innerHTML = item.group
        ? `<span class="region-group-badge">${item.group}군</span><span class="region-name-text">${item.region}</span>`
        : `<span style="color:var(--text3);font-size:12px">지역 입력 후 자동 표시</span>`;
    }
    const readonlyInputs = card.querySelectorAll('input[readonly]');
    if (readonlyInputs[0]) {
      readonlyInputs[0].value = item.group && item.category ? (LAND_INDEX[item.category]?.[item.group] ?? '-') : '-';
    }
  }
  saveData();
}

function calcLand(idx) {
  const item = landItems[idx];
  if (item.group && item.category && item.officialPrice && item.area) {
    const rate = LAND_INDEX[item.category]?.[item.group] ?? 0;
    item.result = Math.round(rate * parseFloat(item.officialPrice) * parseFloat(item.area));
  } else {
    item.result = 0;
  }
  updateSummary();
  saveData();
  // update result display
  const card = document.getElementById(`land-card-${item.id}`);
  if (card) {
    const resVal = card.querySelector('.item-result-value');
    if (resVal) resVal.textContent = fmt(item.result) + '원';
    // update rate display
    const readonlyInputs = card.querySelectorAll('input[readonly]');
    if (readonlyInputs[0]) {
      readonlyInputs[0].value = item.group && item.category ? (LAND_INDEX[item.category]?.[item.group] ?? '-') : '-';
    }
  }
}

          <select onchange="buildingItems[${idx}].use=this.value; calcBuilding(${idx})">
            <option value="">선택</option>
            ${Object.entries(USE_INDEX).map(([k,v]) => `<option value="${k}" ${item.use===k?'selected':''}>${k} [${v}]</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>면적 (㎡ / 평)</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" placeholder="예: 150" value="${item.area}"
              oninput="buildingItems[${idx}].area=this.value; buildingItems[${idx}].areaUnit='m2'; calcBuilding(${idx})" style="flex:1">
            <button class="unit-toggle" onclick="toggleAreaUnit('building',${idx})" title="단위변환">${(item.areaUnit||'m2')==='pyeong'?'평→㎡':'㎡→평'}</button>
          </div>
        </div>
        <div class="field">
          <label>적용 지수 합산</label>
          <input type="text" readonly value="${getBuildingRate(item) ?? '-'}">
        </div>
      </div>

      <div class="item-result" style="border-color:var(--accent2)">
        <span class="item-result-label">건물 감정가</span>
        <span class="item-result-value" style="color:var(--accent2)">${fmt(item.result)}원</span>
      </div>
    </div>
  `).join('');
  updateSummary();
}

function getBuildingRate(item) {
  if (!item.struct || !item.roof || !item.use || !item.age) return null;
  return (STRUCT_INDEX[item.struct] * ROOF_INDEX[item.roof] * USE_INDEX[item.use] * parseFloat(item.age)).toFixed(4);
}

function calcBuilding(idx) {
  const item = buildingItems[idx];
  const rate = getBuildingRate(item);
  if (rate && item.baseType && item.area) {
    item.result = Math.round(BASE_PRICE[item.baseType] * parseFloat(rate) * parseFloat(item.area));
  } else {
    item.result = 0;
  }
  updateSummary();
  saveData();
  const card = document.getElementById(`building-card-${item.id}`);
  if (card) {
    const resVal = card.querySelector('.item-result-value');
    if (resVal) resVal.textContent = fmt(item.result) + '원';
    const readonlyInputs = card.querySelectorAll('input[readonly]');
    if (readonlyInputs[0]) readonlyInputs[0].value = getBuildingRate(item) ?? '-';
  }
}

// ─── SUMMARY ───────────────────────────────────────────────
function updateSummary() {
  const landTotal = landItems.reduce((s, i) => s + i.result, 0);
  const buildingTotal = buildingItems.reduce((s, i) => s + i.result, 0);
  const grand = landTotal + buildingTotal;

  document.getElementById('grand-total').textContent = fmt(grand);
  document.getElementById('land-subtotal').textContent = fmt(landTotal) + '원';
  document.getElementById('building-subtotal').textContent = fmt(buildingTotal) + '원';

  // land summary
  const ls = document.getElementById('land-summary');
  if (landItems.length === 0) {
    ls.innerHTML = '<div class="empty-state">토지를 추가해주세요</div>';
  } else {
    ls.innerHTML = landItems.map(i => `
      <div class="summary-row">
        <span class="summary-row-name">${i.label}</span>
        <span class="summary-row-val">${fmt(i.result)}원</span>
      </div>
    `).join('');
  }

  // building summary
  const bs = document.getElementById('building-summary');
  if (buildingItems.length === 0) {
    bs.innerHTML = '<div class="empty-state">건물을 추가해주세요</div>';
  } else {
    bs.innerHTML = buildingItems.map(i => `
      <div class="summary-row">
        <span class="summary-row-name">${i.label}</span>
        <span class="summary-row-val">${fmt(i.result)}원</span>
      </div>
    `).join('');
  }
}

// ─── UTILS ───────────────────────────────────────────────
function fmt(n) {
  return Number(n).toLocaleString('ko-KR');
}

function resetAll() {
  if (!confirm('전체 초기화할까요?')) return;
  landItems = [];
  buildingItems = [];
  localStorage.removeItem('appraisal_land');
  localStorage.removeItem('appraisal_building');
  localStorage.removeItem('appraisal_counter');
  idCounter = 0;
  renderLandList();
  renderBuildingList();
  updateSummary();
}

function copyResult() {
  const landTotal = landItems.reduce((s, i) => s + i.result, 0);
  const buildingTotal = buildingItems.reduce((s, i) => s + i.result, 0);
  const grand = landTotal + buildingTotal;

  const caseNum = document.getElementById('case-number').value;
  const clientNm = document.getElementById('client-name').value;
  let text = '=== 감정평가 결과 ===\n';
  if (caseNum) text += '영업사원: ' + caseNum + '\n';
  if (clientNm) text += '거래처: ' + clientNm + '\n';
  text += '\n';
  if (landItems.length > 0) {
    text += '[토지]\n';
    landItems.forEach(i => text += `  ${i.label}: ${fmt(i.result)}원\n`);
    text += `  소계: ${fmt(landTotal)}원\n\n`;
  }
  if (buildingItems.length > 0) {
    text += '[건물]\n';
    buildingItems.forEach(i => text += `  ${i.label}: ${fmt(i.result)}원\n`);
    text += `  소계: ${fmt(buildingTotal)}원\n\n`;
  }
  text += `[합산 감정가]: ${fmt(grand)}원`;

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ 복사됨!';
    setTimeout(() => btn.textContent = '📋 결과 복사', 1500);
  });
}

// ─── INIT ───────────────────────────────────────────────
loadData();
renderLandList();
renderBuildingList();
updateSummary();
</script>
